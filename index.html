<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro — Focus Timer</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --surface: #ffffff;
      --surface-muted: #ede9e0;
      --text: #1f1e1b;
      --text-muted: #6c675e;
      --border: #e1dcd1;
      --accent: #d95d39;
      --accent-soft: rgba(217, 93, 57, 0.12);
      --accent-hover: #c34d2b;
      --ring-track: #e6e0d4;
      --shadow: 0 18px 45px rgba(31, 30, 27, 0.08);
    }

    [data-theme="dark"] {
      --bg: #161614;
      --surface: #21201d;
      --surface-muted: #2c2b27;
      --text: #f3f1eb;
      --text-muted: #a19c91;
      --border: #34322d;
      --accent: #e47250;
      --accent-soft: rgba(228, 114, 80, 0.16);
      --accent-hover: #ef8362;
      --ring-track: #32302b;
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
    }

    [data-mode="short"] {
      --accent: #2f855a;
      --accent-soft: rgba(47, 133, 90, 0.14);
      --accent-hover: #276e4b;
    }

    [data-theme="dark"][data-mode="short"] {
      --accent: #48bb78;
      --accent-soft: rgba(72, 187, 120, 0.16);
      --accent-hover: #5cd08b;
    }

    [data-mode="long"] {
      --accent: #2b6cb0;
      --accent-soft: rgba(43, 108, 176, 0.14);
      --accent-hover: #235891;
    }

    [data-theme="dark"][data-mode="long"] {
      --accent: #63b3ed;
      --accent-soft: rgba(99, 179, 237, 0.16);
      --accent-hover: #7cc0f2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .app {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px 26px 28px;
      box-shadow: var(--shadow);
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: -0.01em;
    }

    .brand-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--accent);
      transition: background-color 0.25s ease;
    }

    .icon-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .icon-btn:hover {
      background: var(--surface-muted);
      color: var(--text);
    }

    .icon-btn[aria-pressed="true"] {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: transparent;
    }

    .modes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      padding: 5px;
      border-radius: 14px;
      background: var(--surface-muted);
      margin-bottom: 24px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.85rem;
      padding: 9px 6px;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
    }

    .mode-btn:hover {
      color: var(--text);
    }

    .mode-btn.active {
      background: var(--surface);
      color: var(--accent);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .ring-wrap {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
    }

    .ring-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .ring-track {
      fill: none;
      stroke: var(--ring-track);
      stroke-width: 10;
    }

    .ring-progress {
      fill: none;
      stroke: var(--accent);
      stroke-width: 10;
      stroke-linecap: round;
      transition: stroke 0.25s ease, stroke-dashoffset 0.35s linear;
    }

    .timer-readout {
      text-align: center;
      z-index: 1;
    }

    .time-display {
      font-size: 3.45rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      line-height: 1.05;
    }

    .phase-label {
      margin-top: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .task-row {
      margin-bottom: 18px;
    }

    .task-input {
      width: 100%;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.92rem;
      text-align: center;
      outline: none;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .task-input::placeholder {
      color: var(--text-muted);
    }

    .task-input:focus {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn-primary {
      min-width: 140px;
      height: 46px;
      border: none;
      border-radius: 14px;
      background: var(--accent);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.08s ease;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      height: 46px;
      padding: 0 15px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .btn-secondary:hover {
      background: var(--surface-muted);
    }

    .cycle-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      font-size: 0.84rem;
      color: var(--text-muted);
    }

    .dots {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--ring-track);
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .dot.done {
      background: var(--accent);
      transform: scale(1.08);
    }

    .settings-panel {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      display: none;
    }

    .settings-panel.open {
      display: block;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .field input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface-muted);
      color: var(--text);
      font-size: 0.92rem;
      font-weight: 600;
      outline: none;
    }

    .field input:focus {
      border-color: var(--accent);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.86rem;
      padding: 6px 0;
    }

    .settings-footer {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .link-btn {
      border: none;
      background: none;
      color: var(--accent);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 0;
    }

    .shortcuts {
      margin-top: 14px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    kbd {
      font-family: inherit;
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--surface-muted);
    }
  </style>
</head>
<body data-mode="focus">
  <main class="app" aria-label="Pomodoro Focus Timer">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>Focus Timer</span>
      </div>
      <div class="icon-actions">
        <button class="icon-btn" id="soundBtn" type="button" title="Toggle sound chime" aria-label="Toggle sound chime" aria-pressed="true">
          🔊
        </button>
        <button class="icon-btn" id="themeBtn" type="button" title="Toggle dark mode" aria-label="Toggle dark mode" aria-pressed="false">
          🌙
        </button>
        <button class="icon-btn" id="settingsBtn" type="button" title="Timer settings" aria-label="Timer settings" aria-expanded="false">
          ⚙️
        </button>
      </div>
    </header>

    <div class="modes" role="tablist" aria-label="Timer mode">
      <button class="mode-btn active" type="button" data-mode="focus" role="tab" aria-selected="true">Focus</button>
      <button class="mode-btn" type="button" data-mode="short" role="tab" aria-selected="false">Short Break</button>
      <button class="mode-btn" type="button" data-mode="long" role="tab" aria-selected="false">Long Break</button>
    </div>

    <div class="ring-wrap">
      <svg class="ring-svg" viewBox="0 0 220 220" aria-hidden="true">
        <circle class="ring-track" cx="110" cy="110" r="98"></circle>
        <circle class="ring-progress" id="progressRing" cx="110" cy="110" r="98"></circle>
      </svg>
      <div class="timer-readout">
        <div class="time-display" id="timeDisplay" aria-live="off">25:00</div>
        <div class="phase-label" id="phaseLabel">Ready to focus</div>
      </div>
    </div>

    <div class="task-row">
      <input
        id="taskInput"
        class="task-input"
        type="text"
        maxlength="80"
        placeholder="What are you working on?"
        aria-label="Current focus task"
      />
    </div>

    <div class="controls">
      <button class="btn-secondary" id="resetBtn" type="button" title="Reset timer (R)">Reset</button>
      <button class="btn-primary" id="startBtn" type="button">Start</button>
      <button class="btn-secondary" id="skipBtn" type="button" title="Skip to next phase (S)">Skip</button>
    </div>

    <div class="cycle-bar">
      <div class="dots" id="cycleDots" aria-label="Current 4-session cycle"></div>
      <span id="completedLabel">0 sessions completed</span>
    </div>

    <section class="settings-panel" id="settingsPanel" aria-label="Timer settings">
      <div class="settings-grid">
        <div class="field">
          <label for="focusMin">Focus (min)</label>
          <input id="focusMin" type="number" min="1" max="120" value="25" />
        </div>
        <div class="field">
          <label for="shortMin">Short (min)</label>
          <input id="shortMin" type="number" min="1" max="60" value="5" />
        </div>
        <div class="field">
          <label for="longMin">Long (min)</label>
          <input id="longMin" type="number" min="1" max="90" value="15" />
        </div>
      </div>

      <label class="toggle-row">
        <span>Auto-start next session</span>
        <input id="autoStartToggle" type="checkbox" />
      </label>

      <div class="settings-footer">
        <button class="link-btn" id="testSoundBtn" type="button">Test chime</button>
        <button class="link-btn" id="resetCountBtn" type="button">Clear session count</button>
      </div>
    </section>

    <div class="shortcuts">
      <kbd>Space</kbd> Start/Pause &nbsp;·&nbsp; <kbd>R</kbd> Reset &nbsp;·&nbsp; <kbd>S</kbd> Skip
    </div>
  </main>

  <script>
    (function () {
      const STORAGE_KEY = "simple_pomodoro_v1";
      const MODE_LABELS = {
        focus: "Focus",
        short: "Short Break",
        long: "Long Break"
      };

      const defaultState = {
        durations: { focus: 25, short: 5, long: 15 },
        sound: true,
        autoStart: false,
        theme: window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light",
        completed: 0,
        task: ""
      };

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return structuredCloneFallback(defaultState);
          const parsed = JSON.parse(raw);
          return {
            durations: {
              focus: clampInt(parsed?.durations?.focus, 1, 120, 25),
              short: clampInt(parsed?.durations?.short, 1, 60, 5),
              long: clampInt(parsed?.durations?.long, 1, 90, 15)
            },
            sound: typeof parsed?.sound === "boolean" ? parsed.sound : defaultState.sound,
            autoStart: typeof parsed?.autoStart === "boolean" ? parsed.autoStart : defaultState.autoStart,
            theme: parsed?.theme === "dark" || parsed?.theme === "light" ? parsed.theme : defaultState.theme,
            completed: clampInt(parsed?.completed, 0, 9999, 0),
            task: typeof parsed?.task === "string" ? parsed.task.slice(0, 80) : ""
          };
        } catch {
          return structuredCloneFallback(defaultState);
        }
      }

      function structuredCloneFallback(obj) {
        return JSON.parse(JSON.stringify(obj));
      }

      function clampInt(value, min, max, fallback) {
        const n = Number.parseInt(value, 10);
        if (Number.isNaN(n)) return fallback;
        return Math.min(max, Math.max(min, n));
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(prefs));
        } catch {
          // Ignore storage errors in restricted browsing contexts.
        }
      }

      const prefs = loadState();
      let mode = "focus";
      let totalSeconds = prefs.durations[mode] * 60;
      let remainingSeconds = totalSeconds;
      let timerId = null;
      let endTimestamp = null;

      // DOM elements
      const body = document.body;
      const timeDisplay = document.getElementById("timeDisplay");
      const phaseLabel = document.getElementById("phaseLabel");
      const startBtn = document.getElementById("startBtn");
      const resetBtn = document.getElementById("resetBtn");
      const skipBtn = document.getElementById("skipBtn");
      const soundBtn = document.getElementById("soundBtn");
      const themeBtn = document.getElementById("themeBtn");
      const settingsBtn = document.getElementById("settingsBtn");
      const settingsPanel = document.getElementById("settingsPanel");
      const taskInput = document.getElementById("taskInput");
      const cycleDots = document.getElementById("cycleDots");
      const completedLabel = document.getElementById("completedLabel");
      const focusMinInput = document.getElementById("focusMin");
      const shortMinInput = document.getElementById("shortMin");
      const longMinInput = document.getElementById("longMin");
      const autoStartToggle = document.getElementById("autoStartToggle");
      const testSoundBtn = document.getElementById("testSoundBtn");
      const resetCountBtn = document.getElementById("resetCountBtn");
      const modeButtons = Array.from(document.querySelectorAll(".mode-btn"));
      const progressRing = document.getElementById("progressRing");

      const RING_RADIUS = 98;
      const RING_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;
      progressRing.style.strokeDasharray = String(RING_CIRCUMFERENCE);

      function formatTime(sec) {
        const safe = Math.max(0, Math.ceil(sec));
        const mins = Math.floor(safe / 60);
        const secs = safe % 60;
        return `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
      }

      function applyTheme() {
        document.documentElement.setAttribute("data-theme", prefs.theme);
        const isDark = prefs.theme === "dark";
        themeBtn.textContent = isDark ? "☀️" : "🌙";
        themeBtn.setAttribute("aria-pressed", String(isDark));
      }

      function applySoundBtn() {
        soundBtn.textContent = prefs.sound ? "🔊" : "🔇";
        soundBtn.setAttribute("aria-pressed", String(prefs.sound));
      }

      function renderCycle() {
        const positionInCycle = prefs.completed % 4;
        cycleDots.innerHTML = "";
        for (let i = 0; i < 4; i++) {
          const dot = document.createElement("span");
          dot.className = "dot" + (i < positionInCycle ? " done" : "");
          cycleDots.appendChild(dot);
        }
        const word = prefs.completed === 1 ? "session" : "sessions";
        completedLabel.textContent = `${prefs.completed} ${word} completed`;
      }

      function renderTimer() {
        const formatted = formatTime(remainingSeconds);
        timeDisplay.textContent = formatted;
        const progress = totalSeconds > 0 ? (totalSeconds - remainingSeconds) / totalSeconds : 0;
        progressRing.style.strokeDashoffset = String(RING_CIRCUMFERENCE * (1 - progress));

        if (timerId !== null) {
          document.title = `${formatted} — ${MODE_LABELS[mode]}`;
          phaseLabel.textContent = mode === "focus" ? "Stay focused" : "Take a breather";
          startBtn.textContent = "Pause";
        } else {
          document.title = `Pomodoro — ${MODE_LABELS[mode]}`;
          const isPristine = remainingSeconds === totalSeconds;
          phaseLabel.textContent = isPristine ? `Ready for ${MODE_LABELS[mode].toLowerCase()}` : "Paused";
          startBtn.textContent = isPristine ? "Start" : "Resume";
        }
      }

      function setMode(nextMode, autoStartNext = false) {
        stopInterval();
        mode = nextMode;
        body.setAttribute("data-mode", mode);
        modeButtons.forEach((btn) => {
          const active = btn.dataset.mode === mode;
          btn.classList.toggle("active", active);
          btn.setAttribute("aria-selected", String(active));
        });
        totalSeconds = prefs.durations[mode] * 60;
        remainingSeconds = totalSeconds;
        renderTimer();
        if (autoStartNext) startTimer();
      }

      function stopInterval() {
        if (timerId !== null) {
          clearInterval(timerId);
          timerId = null;
        }
        endTimestamp = null;
      }

      function startTimer() {
        if (timerId !== null) return;
        endTimestamp = Date.now() + remainingSeconds * 1000;
        timerId = setInterval(() => {
          const msLeft = endTimestamp - Date.now();
          remainingSeconds = Math.max(0, Math.ceil(msLeft / 1000));
          renderTimer();
          if (msLeft <= 0) {
            handlePhaseComplete();
          }
        }, 250);
        renderTimer();
      }

      function pauseTimer() {
        if (timerId === null) return;
        const msLeft = endTimestamp - Date.now();
        remainingSeconds = Math.max(0, Math.ceil(msLeft / 1000));
        stopInterval();
        renderTimer();
      }

      function resetTimer() {
        stopInterval();
        totalSeconds = prefs.durations[mode] * 60;
        remainingSeconds = totalSeconds;
        renderTimer();
      }

      function nextModeAfter(currentMode, completedCount) {
        if (currentMode === "focus") {
          return completedCount % 4 === 0 ? "long" : "short";
        }
        return "focus";
      }

      function handlePhaseComplete() {
        stopInterval();
        if (prefs.sound) playChime();
        if (mode === "focus") {
          prefs.completed += 1;
          saveState();
          renderCycle();
        }
        const upcoming = nextModeAfter(mode, prefs.completed);
        setMode(upcoming, prefs.autoStart);
      }

      function skipPhase() {
        const upcoming = mode === "focus"
          ? ((prefs.completed + 1) % 4 === 0 ? "long" : "short")
          : "focus";
        setMode(upcoming, false);
      }

      function playChime() {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        try {
          const ctx = new AudioCtx();
          const notes = [523.25, 659.25, 783.99];
          notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "sine";
            osc.frequency.value = freq;
            const start = ctx.currentTime + idx * 0.14;
            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.exponentialRampToValueAtTime(0.14, start + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.45);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(start);
            osc.stop(start + 0.48);
          });
          setTimeout(() => ctx.close().catch(() => {}), 1200);
        } catch {
          // Ignore audio errors if blocked by browser autoplay policy.
        }
      }

      function syncSettingsInputs() {
        focusMinInput.value = String(prefs.durations.focus);
        shortMinInput.value = String(prefs.durations.short);
        longMinInput.value = String(prefs.durations.long);
        autoStartToggle.checked = prefs.autoStart;
        taskInput.value = prefs.task;
      }

      function updateDuration(key, inputEl, min, max) {
        const val = clampInt(inputEl.value, min, max, prefs.durations[key]);
        inputEl.value = String(val);
        prefs.durations[key] = val;
        saveState();
        if (mode === key && timerId === null) {
          totalSeconds = val * 60;
          remainingSeconds = totalSeconds;
          renderTimer();
        }
      }

      // Event listeners
      startBtn.addEventListener("click", () => {
        if (timerId === null) startTimer();
        else pauseTimer();
      });

      resetBtn.addEventListener("click", resetTimer);
      skipBtn.addEventListener("click", skipPhase);

      modeButtons.forEach((btn) => {
        btn.addEventListener("click", () => setMode(btn.dataset.mode, false));
      });

      soundBtn.addEventListener("click", () => {
        prefs.sound = !prefs.sound;
        applySoundBtn();
        saveState();
      });

      themeBtn.addEventListener("click", () => {
        prefs.theme = prefs.theme === "dark" ? "light" : "dark";
        applyTheme();
        saveState();
      });

      settingsBtn.addEventListener("click", () => {
        const isOpen = settingsPanel.classList.toggle("open");
        settingsBtn.setAttribute("aria-expanded", String(isOpen));
        settingsBtn.setAttribute("aria-pressed", String(isOpen));
      });

      focusMinInput.addEventListener("change", () => updateDuration("focus", focusMinInput, 1, 120));
      shortMinInput.addEventListener("change", () => updateDuration("short", shortMinInput, 1, 60));
      longMinInput.addEventListener("change", () => updateDuration("long", longMinInput, 1, 90));

      autoStartToggle.addEventListener("change", () => {
        prefs.autoStart = autoStartToggle.checked;
        saveState();
      });

      taskInput.addEventListener("input", () => {
        prefs.task = taskInput.value.slice(0, 80);
        saveState();
      });

      testSoundBtn.addEventListener("click", playChime);

      resetCountBtn.addEventListener("click", () => {
        prefs.completed = 0;
        saveState();
        renderCycle();
      });

      document.addEventListener("keydown", (e) => {
        const tag = document.activeElement?.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA") return;
        if (e.code === "Space") {
          e.preventDefault();
          if (timerId === null) startTimer();
          else pauseTimer();
        } else if (e.key === "r" || e.key === "R") {
          resetTimer();
        } else if (e.key === "s" || e.key === "S") {
          skipPhase();
        }
      });

      // Initialize UI
      applyTheme();
      applySoundBtn();
      syncSettingsInputs();
      renderCycle();
      renderTimer();
    })();
  </script>
</body>
</html>
